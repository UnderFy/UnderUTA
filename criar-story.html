<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UnderUTA — Criar Story</title>

    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

<header class="artist-header">

    <div class="artist-logo">
        UnderUTA
    </div>

    <a href="artista.html" id="back-btn">
        Voltar
    </a>

</header>


<main class="create-story">

    <section class="story-header">

        <span class="section-label">
            NOVO STORY
        </span>

        <h1>
            Compartilhe<br>
            um momento.
        </h1>

        <p>
            Crie uma foto ou vídeo para seus ouvintes.
        </p>

    </section>


    <section class="story-form">

        <div class="story-camera">

            <video
                id="camera-preview"
                autoplay
                playsinline
                muted>
            </video>

            <div
                id="camera-placeholder"
                class="camera-placeholder">

                <p>
                    Sua câmera aparecerá aqui.
                </p>

            </div>

        </div>


        <div class="story-camera-actions">

            <button
                id="open-camera"
                type="button">

                Abrir câmera

            </button>

            <button
                id="switch-camera"
                type="button"
                hidden>

                Trocar câmera

            </button>

            <button
                id="take-photo"
                type="button"
                hidden>

                Tirar foto

            </button>

            <button
                id="start-video"
                type="button"
                hidden>

                Gravar vídeo

            </button>

            <button
                id="stop-video"
                type="button"
                hidden>

                Parar gravação

            </button>

        </div>


        <div class="story-divider">
            <span>ou</span>
        </div>


        <label for="story-file">
            Escolher uma mídia do celular
        </label>

        <input
            type="file"
            id="story-file"
            accept="image/*,video/*">


        <div
            id="preview-container"
            class="story-preview">

            <p>
                A prévia aparecerá aqui.
            </p>

        </div>


        <button
            id="publish-story"
            type="button">

            Publicar Story

        </button>


        <p
            id="story-status"
            class="story-status">
        </p>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js?v=2"></script>

<script src="criar-story.js?v=2"></script>

</body>

</html>
