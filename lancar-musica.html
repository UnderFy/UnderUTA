<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lançar música — UnderUTA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            height: 70px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1c1c1c;
            background: #070707;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .back-button {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 15px;
            border: 1px solid #292929;
            border-radius: 10px;
        }

        .back-button:hover {
            color: white;
            border-color: #444;
        }

        .release-page {
            width: min(680px, calc(100% - 32px));
            margin: 0 auto;
            padding: 60px 0 80px;
        }

        .release-header {
            margin-bottom: 35px;
        }

        .eyebrow {
            display: block;
            margin-bottom: 18px;
            color: #777;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: clamp(42px, 9vw, 70px);
            line-height: .95;
            letter-spacing: -4px;
        }

        .release-header p {
            margin: 0;
            color: #888;
            font-size: 17px;
            line-height: 1.6;
        }

        .release-form {
            padding: 28px;
            border: 1px solid #202020;
            border-radius: 20px;
            background: #0a0a0a;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #ddd;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        textarea {
            width: 100%;
            border: 1px solid #292929;
            border-radius: 11px;
            background: #111;
            color: white;
            padding: 14px 15px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #666;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
            font-family: inherit;
        }

        input[type="file"] {
            width: 100%;
            padding: 13px;
            border: 1px dashed #333;
            border-radius: 11px;
            background: #111;
            color: #999;
            font-size: 14px;
        }

        .release-button {
            width: 100%;
            margin-top: 5px;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            background: #f5f5f5;
            color: #050505;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .release-button:active {
            transform: scale(.99);
        }

        @media (max-width: 600px) {

            .topbar {
                padding: 0 16px;
            }

            .release-page {
                padding-top: 40px;
            }

            .release-form {
                padding: 20px;
                border-radius: 16px;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="artista.html" class="logo">
            UnderUTA
        </a>

        <a href="artista.html" class="back-button">
            ← Voltar
        </a>

    </header>


    <main class="release-page">

        <section class="release-header">

            <span class="eyebrow">
                NOVO LANÇAMENTO
            </span>

            <h1>
                Lance sua música.
            </h1>

            <p>
                Publique sua música no UnderUTA e compartilhe
                seu trabalho com seus ouvintes.
            </p>

        </section>


        <form id="music-form" class="release-form">

            <div class="form-group">

                <label for="nome">
                    Nome da música
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Ex: Minha nova música"
                    required
                >

            </div>


            <div class="form-group">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    placeholder="Conte um pouco sobre essa música..."
                    rows="5"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="capa">
                    Capa da música
                </label>

                <input
                    type="file"
                    id="capa"
                    name="capa"
                    accept="image/*"
                    required
                >

            </div>


            <div class="form-group">

                <label for="audio">
                    Arquivo da música
                </label>

                <input
                    type="file"
                    id="audio"
                    name="audio"
                    accept="audio/*"
                    required
                >

            </div>


            <button
                type="submit"
                class="release-button"
            >
                Lançar música
            </button>

        </form>

    </main>


    <script>
    const form = document.getElementById("music-form");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        alert("O botão está funcionando! O JavaScript foi executado.");

    });
</script>

</script>

</body>

</html>
